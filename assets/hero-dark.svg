<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Pratham Sharma — Full Stack and AI Engineer">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21262d" stop-opacity="1"/>
      <stop offset="1" stop-color="#21262d" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="880" height="300" fill="#0d1117"/>
  <rect width="880" height="300" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="879" height="299" fill="none" stroke="#21262d"/>

  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .name { font-size: 34px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.6px; }
    .role { font-size: 15px; font-weight: 600; fill: #2f81f7; letter-spacing: 0.2px; }
    .quote { font-size: 13.5px; fill: #a5adb8; }
    .cap { font-size: 10.5px; font-weight: 700; fill: #7d8590; letter-spacing: 1.4px; }
    .l { font-size: 11.5px; fill: #7d8590; }
    .v { font-size: 25px; font-weight: 700; fill: #e6edf3; }
    .tick { font-size: 11px; font-weight: 600; }
  </style>

  <text x="40" y="60" class="name">Pratham Sharma</text>
  <text x="40" y="84" class="role">FULL STACK + AI ENGINEER</text>
  <text x="40" y="112" class="quote">I build truthful, agentic systems — where humans stay in the loop on judgment calls.</text>

  <text x="40" y="152" class="cap">JAVA/KAFKA ETL REWRITE · SALESCODE.AI · DRAWN TO SCALE</text>

  <rect x="40" y="166" width="800" height="26" rx="3" fill="url(#fade)"/>
  <rect x="40" y="166" width="11" height="26" rx="3" fill="#3fb950"/>

  <text x="63" y="184" class="tick" fill="#3fb950">under 5 min</text>
  <text x="840" y="184" text-anchor="end" class="tick" fill="#7d8590">was 6 hours, nightly</text>

  <line x1="40" y1="214" x2="840" y2="214" stroke="#21262d"/>

    <text x="40" y="252" class="v">64%</text>
    <text x="40" y="272" class="l">fewer UI defect tickets</text>
    <text x="240" y="252" class="v">3</text>
    <text x="240" y="272" class="l">AI features in production</text>
    <text x="440" y="252" class="v">64</text>
    <text x="440" y="272" class="l">components shipped to npm</text>
    <text x="640" y="252" class="v">#382</text>
    <text x="640" y="272" class="l">LeetCode global · Knight</text>
</svg>
